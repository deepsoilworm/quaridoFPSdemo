<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로시저럴 던전 게임</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        #gameContainer {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
        }
        
        #mapOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
        }
        
        #mapCanvas {
            border: 2px solid white;
            background: #1a1a2e;
        }
        
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            z-index: 150;
            pointer-events: none;
        }
        
        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: white;
        }
        
        #crosshair::before {
            width: 2px;
            height: 100%;
            left: 50%;
            transform: translateX(-50%);
        }
        
        #crosshair::after {
            width: 100%;
            height: 2px;
            top: 50%;
            transform: translateY(-50%);
        }
        
        .door-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            display: none;
            z-index: 151;
            pointer-events: none;
        }
        
        #minimap {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 200px;
            height: 200px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid white;
            z-index: 100;
        }
        
        #roomSelection {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border-radius: 10px;
            border: 2px solid white;
            z-index: 300;
            display: none;
            color: white;
            min-width: 500px;
        }
        
        #roomSelection h3 {
            margin-bottom: 20px;
            text-align: center;
        }
        
        .room-option {
            display: flex;
            align-items: center;
            margin: 15px 0;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .room-option:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .room-option input[type="radio"] {
            margin-right: 15px;
            width: 20px;
            height: 20px;
        }
        
        .room-preview {
            width: 80px;
            height: 80px;
            margin-right: 15px;
            border: 1px solid white;
            background: #1a1a2e;
        }
        
        .room-info {
            flex: 1;
        }
        
        .room-info h4 {
            margin-bottom: 5px;
        }
        
        #confirmRoom {
            margin-top: 20px;
            padding: 10px 20px;
            background: #4a9a4a;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }
        
        #confirmRoom:hover {
            background: #5aaa5a;
        }
        
        #confirmRoom:disabled {
            background: #555;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="ui">
            <div>WASD: 이동 | 마우스: 시야 조절</div>
            <div>E: 새 방 생성 (방 종류 선택)</div>
            <div>E: 맵 보기 (문 근처가 아닐 때)</div>
            <div>ESC: 맵 닫기</div>
        </div>
        <div id="crosshair"></div>
        <div class="door-hint" id="doorHint">E키를 눌러 문 열기</div>
        <canvas id="minimap"></canvas>
        <div id="roomSelection">
            <h3>방 종류를 선택하세요</h3>
            <div id="roomOptions"></div>
            <button id="confirmRoom" disabled>확인</button>
        </div>
        <div id="mapOverlay">
            <canvas id="mapCanvas"></canvas>
        </div>
    </div>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    
    <script type="module" src="game.js"></script>
</body>
</html>
